# ============================================================================
# Laige CI — full P0 platform matrix on pull request (M0-CI-01,
# re-baselined 2026-10-11)
#
# Roadmap:  roadmap/M0-foundations.md, step M0-CI-01
# PRD refs: §6 (P0 platforms, AC-6.1), §14 (cadence), §8.1 (build budget)
#
# Cadence (PRD §14, as amended 2026-10-11 — "test everything, all the
# time"): this workflow runs on EVERY pull request, and ALL eleven jobs
# run — unconditionally:
#
#   * the five P0 OS jobs (linux-gcc, linux-clang, windows-msvc,
#     macos-arm64, macos-intel);
#   * the two sanitizer lanes (linux-asan, linux-tsan; M0-CI-02);
#   * the four platform-independent tooling jobs (include-lint,
#     determinism-lint, api-manifest, detcheck).
#
# The former ci:windows / ci:macos label selector is REMOVED: no job is
# gated on a label and no test is ever skipped. Linux is no longer
# "verified locally only" — it runs in the PR lane exactly as in the
# merge lane (ci.yml), so a PR that breaks a Linux tree fails in the
# PR lane before it can reach master. Local verification of the Linux
# trees before pushing remains a developer obligation (AGENTS.md,
# section 5: the local Linux test gate).
#
# Jobs, runner images, steps, and the build-budget timeouts are the
# same as in ci.yml — including the macOS exception (the two macOS
# jobs carry timeout-minutes: 15, the shared-runners tail latency),
# documented in ci.yml's header (the full matrix documentation and
# the Windows multi-config note). The one difference: the sanitizer
# jobs upload no artifacts here. The pull_request GITHUB_TOKEN is
# read-only (contents:read for same-repo PRs, read-only for fork PRs —
# Actions cannot grant actions:write on this event), so the report
# files are not archived; the tee'd ctest output keeps every sanitizer
# report in the job log, which is enough to diagnose a red PR. The
# merge lane (ci.yml) still archives them as artifacts.
#
# Fuzz lane (PRD §14 "every commit (bounded)"; M0-TEST-01): no separate
# fuzz job — the `fuzz_json_parse` ctest entry (1000 deterministic runs
# of laige-fuzz on the json_parse target) runs inside every build
# job's ctest, instrumented in the ASan tree. Seed and nightly-long-run
# conventions: docs/testing.md.
#
# Include-graph lint (M0-CI-03; NFR-8.11, NFR-8.13): the `include-lint`
# job runs on EVERY pull request — it is a platform-independent
# repository check (Python 3 stdlib only), not a P0 OS build. It
# enforces the PRD §10.1 include rules over src/** (laige-core depends
# on nothing internal; arrows only downward in the module stack;
# vendored deps only included from their deps.lock `owner`) and reports
# the vendored-dependency count, which must stay ≤ 10 (PRD §11).
#
# Fork PRs: this workflow uses the pull_request event, which runs on the
# merge ref with a read-only token; checkout + build + ctest need nothing
# beyond contents:read (no job in this workflow uploads artifacts).
# ============================================================================

name: CI (pull request)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux-gcc:
    name: Linux x64 (g++)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GLFW X11 headers (laige-render)
        # GLFW's X11 backend (GLFW_BUILD_WAYLAND=OFF in src/laige-render/
        # CMakeLists.txt) needs only the X11 *headers* at configure time
        # (GLFW 3.5 dlopens the X11/GL libraries at runtime); the
        # ubuntu-24.04 runner image ships none of them. The libegl/libgl
        # packages are the RUNTIME GL stack for the headless GL smoke
        # (Mesa surfaceless EGL + llvmpipe software GL; the engine and
        # GLAD load them by dlopen at runtime) (M2-GL-01).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev \
            libegl1 libgl1 libegl-mesa0 libglx-mesa0 libgl1-mesa-dri
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build build -j
      - name: Test (unit)
        run: ctest --test-dir build --output-on-failure

  linux-clang:
    name: Linux x64 (clang++)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GLFW X11 headers (laige-render)
        # GLFW's X11 backend (GLFW_BUILD_WAYLAND=OFF in src/laige-render/
        # CMakeLists.txt) needs only the X11 *headers* at configure time
        # (GLFW 3.5 dlopens the X11/GL libraries at runtime); the
        # ubuntu-24.04 runner image ships none of them. The libegl/libgl
        # packages are the RUNTIME GL stack for the headless GL smoke
        # (Mesa surfaceless EGL + llvmpipe software GL; the engine and
        # GLAD load them by dlopen at runtime) (M2-GL-01).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev \
            libegl1 libgl1 libegl-mesa0 libglx-mesa0 libgl1-mesa-dri
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build -j
      - name: Test (unit)
        run: ctest --test-dir build --output-on-failure

  linux-asan:
    name: Linux x64 ASan+UBSan (clang++)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # No artifact step here: the pull_request token is read-only (see
    # the header). The tee keeps every report in the job log.
    steps:
      - uses: actions/checkout@v4
      - name: Install GLFW X11 headers (laige-render)
        # GLFW's X11 backend (GLFW_BUILD_WAYLAND=OFF in src/laige-render/
        # CMakeLists.txt) needs only the X11 *headers* at configure time
        # (GLFW 3.5 dlopens the X11/GL libraries at runtime); the
        # ubuntu-24.04 runner image ships none of them. The libegl/libgl
        # packages are the RUNTIME GL stack for the headless GL smoke
        # (Mesa surfaceless EGL + llvmpipe software GL; the engine and
        # GLAD load them by dlopen at runtime) (M2-GL-01).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev \
            libegl1 libgl1 libegl-mesa0 libglx-mesa0 libgl1-mesa-dri
      - name: Configure (ASan+UBSan)
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DLAIGE_ASAN=ON
      - name: Build (ASan+UBSan)
        run: cmake --build build-asan -j
      - name: Test (unit, ASan+UBSan)
        # Every sanitizer report is fatal to the test process: ASan via
        # abort_on_error=1:halt_on_error=1 here, UBSan via
        # -fno-sanitize-recover=all (wired by CMake). detect_leaks=1 (the
        # Linux default) is stated explicitly.
        env:
          ASAN_OPTIONS: "abort_on_error=1:halt_on_error=1:detect_leaks=1"
        run: |
          set -o pipefail
          ctest --test-dir build-asan --output-on-failure 2>&1 | tee asan-ctest-output.txt

  linux-tsan:
    name: Linux x64 TSan (clang++)
    # 30 min (not 10): TSan is the slowest lane by design (~5-15x
    # instrumentation overhead), and the suite has grown past the old
    # margin (the documented rationale, with the evidence runs, is in
    # the linux-tsan job of ci.yml).
    # No artifact step here: the pull_request token is read-only (see
    # the header). The tee keeps the race report in the job log.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install GLFW X11 headers (laige-render)
        # GLFW's X11 backend (GLFW_BUILD_WAYLAND=OFF in src/laige-render/
        # CMakeLists.txt) needs only the X11 *headers* at configure time
        # (GLFW 3.5 dlopens the X11/GL libraries at runtime); the
        # ubuntu-24.04 runner image ships none of them. The libegl/libgl
        # packages are the RUNTIME GL stack for the headless GL smoke
        # (Mesa surfaceless EGL + llvmpipe software GL; the engine and
        # GLAD load them by dlopen at runtime) (M2-GL-01).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev \
            libegl1 libgl1 libegl-mesa0 libglx-mesa0 libgl1-mesa-dri
      - name: Configure (TSan)
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DLAIGE_TSAN=ON
      - name: Build (TSan)
        run: cmake --build build-tsan -j
      - name: Test (unit, TSan)
        # TSAN_OPTIONS=halt_on_error=1 is applied per test by tests/
        # (M0-BUILD-01), so the first data race report kills the test
        # process and ctest fails. The race report is printed to stderr
        # and captured by the tee below.
        run: |
          set -o pipefail
          ctest --test-dir build-tsan --output-on-failure 2>&1 | tee tsan-ctest-output.txt

  windows-msvc:
    name: Windows x64 (MSVC 2022)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        # CMAKE_BUILD_TYPE is ignored by the multi-config VS generator; the
        # Debug configuration is pinned on the build/test steps below.
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --config Debug -j
      - name: Test (unit)
        # The trait_compile_* fixtures invoke cl.exe DIRECTLY from a
        # generated cmake -P script (execute_process), outside the VS
        # generator's toolchain setup, so — unlike every other test in
        # this job — they need the MSVC environment (INCLUDE/LIB/PATH)
        # to find the CRT/STL headers; the plain runner shell lacks it
        # and cl fails with C1083 on <cstdint> etc. This step imports
        # the VS development environment into the current PowerShell
        # process: vswhere locates the installation, VsDevCmd.bat (the
        # canonical vcvars, present in every VS 2017+ install under
        # Common7\Tools — called by relative name from that directory,
        # so no path quoting is involved) sets it, and its `set` dump
        # is imported variable by variable. ctest, cmake -P, and cl all
        # inherit it. Everything else in this step is unchanged.
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Push-Location (Join-Path $vs "Common7\Tools")
          $envDump = cmd /c "call VsDevCmd.bat -arch=amd64 -host_arch=amd64 >nul && set"
          Pop-Location
          foreach ($line in $envDump) {
            if ($line -match '^([A-Za-z_][A-Za-z0-9_]*)=(.*)$') {
              Set-Item -Path "env:$($matches[1])" -Value $matches[2]
            }
          }
          ctest --test-dir build -C Debug --output-on-failure

  macos-arm64:
    name: macOS arm64 (AppleClang)
    runs-on: macos-15
    # The shared macOS runners' tail latency exceeds the 10-min build
    # budget (the macOS exception, documented in ci.yml's header).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j
      - name: Test (unit)
        run: ctest --test-dir build --output-on-failure

  macos-intel:
    name: macOS Intel (AppleClang)
    runs-on: macos-14
    # The shared macOS runners' tail latency exceeds the 10-min build
    # budget (the macOS exception, documented in ci.yml's header).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j
      - name: Test (unit)
        run: ctest --test-dir build --output-on-failure

  include-lint:
    # M0-CI-03: runs on every PR. Platform-independent: the lint is
    # Python 3 stdlib only (no setup step needed) and checks the
    # repository layout, not a compiler-specific build. The CTest
    # suite runs it against the real tree in every P0 job as well
    # (tests/tools, test `include-lint-real-tree`), so a broken include
    # fails every job, not just this one.
    name: Include-graph lint + dependency count
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint include graph + report dependency count
        run: python3 tools/laige-include-lint

  determinism-lint:
    # M1-DET-01: runs on every PR. The sim-source determinism scan
    # (the second half of the G-R8 guarantee; the first is the
    # compile-time trait checked by the trait_compile_* CTest
    # fixtures): forbids raw float/double and unordered containers in
    # src/laige-sim/**, with per-line LAIGE-DETERM-EXCEPTION markers as
    # the documented false-positive policy (docs/concepts/determinism.md).
    # Platform-independent: Python 3 stdlib only, no setup step. The
    # CTest suite runs it against fixture trees and the real tree in
    # every P0 job as well (tests/tools, tests `determinism-lint-*`).
    name: Determinism source scan (sim module)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan sim sources for raw FP / unordered containers
        run: python3 tools/laige-determinism-lint

  api-manifest:
    # M0-TOOL-01: runs on every PR. The checked-in public API manifest
    # (laige-api.json, PRD §9.4, NFR-13.1) must stay in sync with the
    # public headers: this job regenerates it from the current headers
    # with laige-api-scanner and fails on any drift, so adding a public
    # symbol without regenerating the manifest fails CI. The CTest
    # suite runs the same check against the real tree in every P0 job
    # as well (tests/api, test `api-real-tree`).
    name: Public API manifest drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GLFW X11 headers (laige-render)
        # GLFW's X11 backend (GLFW_BUILD_WAYLAND=OFF in src/laige-render/
        # CMakeLists.txt) needs only the X11 *headers* at configure time
        # (GLFW 3.5 dlopens the X11/GL libraries at runtime); the
        # ubuntu-24.04 runner image ships none of them. The libegl/libgl
        # packages are the RUNTIME GL stack for the headless GL smoke
        # (Mesa surfaceless EGL + llvmpipe software GL; the engine and
        # GLAD load them by dlopen at runtime) (M2-GL-01).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev \
            libegl1 libgl1 libegl-mesa0 libglx-mesa0 libgl1-mesa-dri
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build scanner
        run: cmake --build build --target laige-api-scanner -j
      - name: Check manifest drift
        run: ./build/bin/laige-api-scanner --root . --check laige-api.json

  detcheck:
    # M1-DET-04: runs on every PR. The determinism checker (FR-11.5):
    # the built-in synthetic scenario self-check, then the M1-SAMPLE-01
    # hello scenario asserted against the committed per-tick hash
    # baselines (samples/hello/baselines/) on BOTH SimMath backends
    # (fixed_point_16_16, float_pinned_32 — ADR 0002) with `hello
    # --expect` (the laige-replay --expect contract: 0 match, 1 first
    # divergence, 2 baseline read/contract error). The full
    # two-configuration matrix (g++ vs clang++, Debug+ASan vs Release)
    # runs on merges in the detcheck job of ci.yml.
    name: Determinism check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GLFW X11 headers (laige-render)
        # GLFW's X11 backend (GLFW_BUILD_WAYLAND=OFF in src/laige-render/
        # CMakeLists.txt) needs only the X11 *headers* at configure time
        # (GLFW 3.5 dlopens the X11/GL libraries at runtime); the
        # ubuntu-24.04 runner image ships none of them. The libegl/libgl
        # packages are the RUNTIME GL stack for the headless GL smoke
        # (Mesa surfaceless EGL + llvmpipe software GL; the engine and
        # GLAD load them by dlopen at runtime) (M2-GL-01).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev \
            libegl1 libgl1 libegl-mesa0 libglx-mesa0 libgl1-mesa-dri
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j
      - name: Synthetic scenario self-check
        run: ./build/bin/laige-detcheck --scenario=synthetic
      - name: Real scenario vs baselines (M1-SAMPLE-01, both backends)
        # The hello template is always built in this job, so both steps
        # always execute. Each must exit 0 (a first-divergence report is
        # exit 1; a baseline read/contract failure is exit 2) and print
        # the 301-line per-tick hash stream.
        run: |
          ./samples/hello/bin/hello \
            --expect samples/hello/baselines/fixed_point_16_16/hash_stream.txt
          ./samples/hello/bin/hello-fp32 \
            --expect samples/hello/baselines/float_pinned_32/hash_stream.txt

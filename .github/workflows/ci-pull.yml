  # ------------------------------------------------------------------------
  # Golden reference regeneration (M2-GOLD-01)
  #
  # Label-gated job for the PR lane (label ci:golden-update): renders
  # the golden fixtures in the reference environment (ubuntu-24.04,
  # Debug, g++, Mesa surfaceless EGL + llvmpipe) and prints the
  # resulting PNGs to the job log as single-line base64 between
  # GOLDEN_REFERENCE_BEGIN / GOLDEN_REFERENCE_END markers. The
  # committing human decodes, reviews, and commits the references (no
  # artifact upload — the pull_request token is read-only for those).
  # The workflow_dispatch-only .github/workflows/golden-update.yml is
  # the same job for the post-merge master path (workflow_dispatch
  # only sees workflows on the default branch, so a PR branch cannot
  # be dispatched). docs/testing.md §6,
  # tools/golden/references/README.md.
  # ------------------------------------------------------------------------
  golden-references:
    name: Golden references (label-gated, ubuntu-24.04, g++, llvmpipe)
    runs-on: ubuntu-24.04
    # 30: build (~1.5 min) + four 1280x720 software-GL renders (the
    # sprite + UI fixtures, and the two M2-AC-01 ac4 fixtures — two
    # passes each, small scenes) + font rasterization, plus runner
    # variance.
    timeout-minutes: 30
    if: contains(github.event.pull_request.labels.*.name, 'ci:golden-update')
    steps:
      - uses: actions/checkout@v4
      - name: Install GLFW X11 headers (laige-render)
        # Same rationale as the main job (see linux-gcc).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev \
            libegl1 libgl1 libegl-mesa0 libglx-mesa0 libgl1-mesa-dri
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++
      - name: Build laige-golden
        run: cmake --build build --target laige-golden -j
      - name: Render the references (--update, build directory)
        # The references land in the build directory (never in the
        # source tree — the source-tree copies are committed by a
        # human from this job's log).
        env:
          LAIGE_TEST_FONT_PATH: ${{ github.workspace }}/tests/laige-render/assets/vera.ttf
        run: |
          mkdir -p build/golden-references
          ./build/bin/laige-golden --update --all \
            --references build/golden-references
      - name: Verify determinism (in-run compare)
        # The freshly rendered frames must compare against themselves
        # within the documented tolerance: a red here means the
        # environment is not deterministic (or the tolerance contract
        # broke), and the run's references must not be trusted.
        env:
          LAIGE_TEST_FONT_PATH: ${{ github.workspace }}/tests/laige-render/assets/vera.ttf
        run: |
          ./build/bin/laige-golden --all \
            --references build/golden-references \
            --max-channel-diff 2 --pixel-budget-pct 0.001
      - name: Print the references (base64, for log extraction)
        # One block per fixture: the BEGIN/END markers carry the
        # fixture name (the reference file is <fixture>.png); the
        # base64 is a single line (base64 -w0).
        run: |
          for f in build/golden-references/*.png; do
            name=$(basename "$f" .png)
            echo "GOLDEN_REFERENCE_BEGIN $name"
            base64 -w0 "$f"
            echo
            echo "GOLDEN_REFERENCE_END $name"
          done

  windows-msvc:
    name: Windows x64 (MSVC 2022)
    runs-on: windows-2022
    # Unchanged by the 2026-10-13 slow-suite split: no ctest entry
    # exceeds 30 s on this lane (worst: laige-sim_tests 16.71 s in the
    # evidence run), so the full suite stays in the main job.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        # CMAKE_BUILD_TYPE is ignored by the multi-config VS generator; the
        # Debug configuration is pinned on the build/test steps below.
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --config Debug -j
      - name: Test (unit)
        # The trait_compile_* fixtures invoke cl.exe DIRECTLY from a
        # generated cmake -P script (execute_process), outside the VS
        # generator's toolchain setup, so — unlike every other test in
        # this job — they need the MSVC environment (INCLUDE/LIB/PATH)
        # to find the CRT/STL headers; the plain runner shell lacks it
        # and cl fails with C1083 on <cstdint> etc. This step imports
        # the VS development environment into the current PowerShell
        # process: vswhere locates the installation, VsDevCmd.bat (the
        # canonical vcvars, present in every VS 2017+ install under
        # Common7\Tools — called by relative name from that directory,
        # so no path quoting is involved) sets it, and its `set` dump
        # is imported variable by variable. ctest, cmake -P, and cl all
        # inherit it. Everything else in this step is unchanged.
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Push-Location (Join-Path $vs "Common7\Tools")
          $envDump = cmd /c "call VsDevCmd.bat -arch=amd64 -host_arch=amd64 >nul && set"
          Pop-Location
          foreach ($line in $envDump) {
            if ($line -match '^([A-Za-z_][A-Za-z0-9_]*)=(.*)$') {
              Set-Item -Path "env:$($matches[1])" -Value $matches[2]
            }
          }
          ctest --test-dir build -C Debug --output-on-failure


# ============================================================================
# Laige CI — P0 platform matrix on pull request (M0-CI-01)
#
# Roadmap:  roadmap/M0-foundations.md, step M0-CI-01
# PRD refs: §6 (P0 platforms, AC-6.1), §14 (cadence), §8.1 (build budget)
#
# Cadence (PRD §14: "one per PR, all per merge"): each pull request runs
# exactly ONE P0 OS, selected by the PR's ci:* label; the default (no
# label) is Linux. Merges to master run ALL P0 OSes via ci.yml, which is
# the "all per merge" half of the cadence.
#
# Label selector (apply at most one per PR; if several are present the
# highest-priority label wins, so exactly one P0 OS always runs):
#
#   ci:macos    → macos-arm64 + macos-intel jobs
#   ci:windows  → windows-msvc job
#   ci:linux    → linux-gcc + linux-clang jobs (also the no-label default)
#
# NOTE: the labels must be created once in the repository settings
# (GitHub does not create labels from workflows). A PR with an unknown
# or missing ci:* label simply falls back to the Linux default.
#
# Jobs, runner images, steps, and the 10-minute budget timeout are the
# same as in ci.yml (see its header for the full matrix documentation
# and the Windows multi-config note).
#
# Sanitizer lanes (M0-CI-02): linux-asan (LAIGE_ASAN=ON) and linux-tsan
# (LAIGE_TSAN=ON) run under the same condition as the default Linux
# jobs — i.e. on every PR that does not select another P0 OS — because
# they are part of the Linux P0 check (PRD §14: one P0 OS per PR). See
# the ci.yml header for the lane semantics (fatal sanitizer reports,
# report archiving, toolchain choice).
#
# Fuzz lane (PRD §14 "every commit (bounded)"; M0-TEST-01): no separate
# fuzz job — the `fuzz_json_parse` ctest entry (1000 deterministic runs
# of laige-fuzz on the json_parse target) runs inside every build
# job's ctest, instrumented in the ASan tree. Seed and nightly-long-run
# conventions: docs/testing.md.
#
# Include-graph lint (M0-CI-03; NFR-8.11, NFR-8.13): the `include-lint`
# job runs on EVERY pull request, independent of the ci:* label selector
# — it is a platform-independent repository check (Python 3 stdlib only),
# not a P0 OS build, so it does not interact with the "one P0 OS per PR"
# cadence. It enforces the PRD §10.1 include rules over src/** (laige-core
# depends on nothing internal; arrows only downward in the module stack;
# vendored deps only included from their deps.lock `owner`) and reports
# the vendored-dependency count, which must stay ≤ 10 (PRD §11).
#
# Fork PRs: this workflow uses the pull_request event, which runs on the
# merge ref with a read-only token; checkout + build + ctest need nothing
# beyond contents:read. On such PRs the artifact upload (needs
# actions:write) fails with a 403, so the upload steps carry
# continue-on-error: true — the reports then remain in the job log and
# the tee'd output instead of the artifact.
# ============================================================================

name: CI (pull request)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux-gcc:
    name: Linux x64 (g++)
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'ci:macos') &&
      !contains(github.event.pull_request.labels.*.name, 'ci:windows')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GLFW X11 headers (laige-render)
        # GLFW's X11 backend (GLFW_BUILD_WAYLAND=OFF in src/laige-render/
        # CMakeLists.txt) needs only the X11 *headers* at configure time
        # (GLFW 3.5 dlopens the X11/GL libraries at runtime); the
        # ubuntu-24.04 runner image ships none of them. The libegl/libgl
        # packages are the RUNTIME GL stack for the headless GL smoke
        # (Mesa surfaceless EGL + llvmpipe software GL; the engine and
        # GLAD load them by dlopen at runtime) (M2-GL-01).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev \
            libegl1 libgl1 libegl-mesa0 libglx-mesa0 libgl1-mesa-dri
      - name: Probe runtime GL stack (temporary diagnostic, v2)
        # TEMPORARY (M2-GL-01): run 36485613200 showed dlopen OK, surfaceless
        # display OK, eglInitialize OK, but eglBindAPI(EGL_OPENGL_API) after
        # eglInitialize failed with 0x300C (EGL_NOT_SUPPORTED). This probe
        # tests BOTH bind orders (the engine currently does
        # initialize->bindAPI; the EGL spec requires bindAPI before
        # initialize), reports EGL_CLIENT_APIS, tries the ES2 API as a
        # control, and re-runs the whole chain under GALLIUM_DRIVER=llvmpipe
        # and MESA_LOADER_DRIVER_OVERRIDE=llvmpipe (software driver
        # override for the DRM-less runner). Remove once the smoke runs
        # green in CI.
        continue-on-error: true
        run: |
          set -x
          cat > /tmp/glprobe.cpp <<'EOF'
          #include <dlfcn.h>
          #include <cstdio>
          #include <cstdlib>

          typedef void* (*P_GetPlatformDisplay)(int, void*, const int*);
          typedef int   (*P_Initialize)(void*, int*, int*);
          typedef int   (*P_BindAPI)(int);
          typedef void* (*P_CreateContext)(void*, void*, void*, const int*);
          typedef int   (*P_MakeCurrent)(void*, void*, void*, void*);
          typedef const char* (*P_QueryString)(void*, int);
          typedef unsigned int (*P_GetError)();
          typedef void  (*P_DestroyDisplay)(void*);
          typedef void* (*P_GLXGPA)(const char*);

          // EGL 1.5 spec constants.
          constexpr int kEGLVendor = 0x3053;
          constexpr int kEGLVersion = 0x3054;
          constexpr int kEGLClientApis = 0x308D;
          constexpr int kEGLOpenGLApi = 0x202A;
          constexpr int kEGLOpenGLEs2Api = 0x30A5;
          constexpr int kEGLContextMajor = 0x2091;
          constexpr int kEGLContextMinor = 0x2092;
          constexpr int kEGLContextProfileMask = 0x2096;
          constexpr int kEGLCoreProfileBit = 0x00000001;
          constexpr int kEGLSurfacelessMesa = 0x31DD;
          constexpr unsigned int kGLVersion = 0x1F03;

          int runChain(const char* label, void* h,
                       P_GetPlatformDisplay gpd, P_Initialize init,
                       P_BindAPI bapi, P_CreateContext cctx,
                       P_MakeCurrent mkcur, P_QueryString qstr,
                       P_GetError err, P_DestroyDisplay dstd) {
            (void)h;
            void* dpy = gpd(kEGLSurfacelessMesa, nullptr, nullptr);
            if (!dpy) { std::printf("[%s] surfaceless display FAILED err=0x%x\n", label, err ? err() : 0); return 3; }
            const char* vendor = qstr(dpy, kEGLVendor);
            const char* clientApis = qstr(dpy, kEGLClientApis);
            std::printf("[%s] vendor=%s client_apis=%s\n", label,
                        vendor ? vendor : "(null)", clientApis ? clientApis : "(null)");
            // Order A (current engine): initialize, THEN bindAPI.
            int major = 0, minor = 0;
            if (!init(dpy, &major, &minor)) {
              std::printf("[%s] A: eglInitialize FAILED err=0x%x\n", label, err ? err() : 0);
              dstd(dpy); return 4;
            }
            std::printf("[%s] A: initialize ok (%d.%d); client_apis=%s\n", label, major, minor,
                        qstr(dpy, kEGLClientApis) ? qstr(dpy, kEGLClientApis) : "(null)");
            if (bapi(kEGLOpenGLApi)) {
              std::printf("[%s] A: bindAPI(OPENGL) after init OK\n", label);
            } else {
              std::printf("[%s] A: bindAPI(OPENGL) after init FAILED err=0x%x; ES2 bind after init: %s\n",
                          label, err ? err() : 0, bapi(kEGLOpenGLEs2Api) ? "ok" : "also failed");
            }
            dstd(dpy);
            // Order B (EGL spec): bindAPI, THEN initialize.
            void* dpy2 = gpd(kEGLSurfacelessMesa, nullptr, nullptr);
            if (!dpy2) { std::printf("[%s] B: surfaceless display FAILED err=0x%x\n", label, err ? err() : 0); dstd(dpy); return 5; }
            if (!bapi(kEGLOpenGLApi)) {
              std::printf("[%s] B: bindAPI(OPENGL) before init FAILED err=0x%x; client_apis=%s\n",
                          label, err ? err() : 0,
                          qstr(dpy2, kEGLClientApis) ? qstr(dpy2, kEGLClientApis) : "(null)");
              dstd(dpy2); return 6;
            }
            std::printf("[%s] B: bindAPI(OPENGL) before init OK\n", label);
            if (!init(dpy2, &major, &minor)) {
              std::printf("[%s] B: eglInitialize after bind FAILED err=0x%x\n", label, err ? err() : 0);
              dstd(dpy2); return 7;
            }
            const int attrs[] = {kEGLContextMajor, 3, kEGLContextMinor, 3,
                                 kEGLContextProfileMask, kEGLCoreProfileBit, 0};
            void* ctx = cctx(dpy2, nullptr, nullptr, attrs);
            if (!ctx) { std::printf("[%s] B: eglCreateContext(3.3 core) FAILED err=0x%x\n", label, err ? err() : 0); dstd(dpy2); return 8; }
            if (!mkcur(dpy2, nullptr, nullptr, ctx)) { std::printf("[%s] B: eglMakeCurrent FAILED err=0x%x\n", label, err ? err() : 0); dstd(dpy2); return 9; }
            const char* eglver = qstr(dpy2, kEGLVersion);
            std::printf("[%s] B: EGL_VERSION=%s; now checking the GLAD loader path (libGL.so.1 + glXGetProcAddressARB)\n",
                        label, eglver ? eglver : "(null)");
            void* g = dlopen("libGL.so.1", RTLD_LAZY | RTLD_LOCAL);
            if (!g) { std::printf("[%s] B: dlopen(libGL.so.1) FAILED: %s\n", label, dlerror()); dstd(dpy2); return 10; }
            auto glxgpa = reinterpret_cast<P_GLXGPA>(dlsym(g, "glXGetProcAddressARB"));
            if (!glxgpa) { std::printf("[%s] B: glXGetProcAddressARB MISSING\n", label); dstd(dpy2); return 11; }
            auto gsa = reinterpret_cast<const char* (*)(unsigned int)>(glxgpa("glGetString"));
            if (!gsa) { std::printf("[%s] B: glXGetProcAddressARB(glGetString) returned NULL\n", label); dstd(dpy2); return 12; }
            const char* gver = gsa(kGLVersion);
            const char* gvendor = gsa(0x1F00 /* GL_VENDOR */);
            const char* grenderer = gsa(0x1F02 /* GL_RENDERER */);
            std::printf("[%s] B: GL_VERSION=%s GL_VENDOR=%s GL_RENDERER=%s — FULL CHAIN OK\n",
                        label, gver ? gver : "(null)", gvendor ? gvendor : "(null)",
                        grenderer ? grenderer : "(null)");
            dstd(dpy2); return 0;
          }

          int main(int argc, char** argv) {
            const char* label = (argc > 1) ? argv[1] : "baseline";
            const char* disp = std::getenv("DISPLAY");
            const char* gallium = std::getenv("GALLIUM_DRIVER");
            const char* mesaOverride = std::getenv("MESA_LOADER_DRIVER_OVERRIDE");
            std::printf("=== probe %s: DISPLAY=%s GALLIUM_DRIVER=%s MESA_LOADER_DRIVER_OVERRIDE=%s\n",
                        label, disp ? disp : "(unset)", gallium ? gallium : "(unset)",
                        mesaOverride ? mesaOverride : "(unset)");
            void* h = dlopen("libEGL.so.1", RTLD_LAZY | RTLD_LOCAL);
            if (!h) { std::printf("[%s] dlopen(libEGL.so.1) FAILED: %s\n", label, dlerror()); return 1; }
            auto gpd   = reinterpret_cast<P_GetPlatformDisplay>(dlsym(h, "eglGetPlatformDisplay"));
            auto init  = reinterpret_cast<P_Initialize>(dlsym(h, "eglInitialize"));
            auto bapi  = reinterpret_cast<P_BindAPI>(dlsym(h, "eglBindAPI"));
            auto cctx  = reinterpret_cast<P_CreateContext>(dlsym(h, "eglCreateContext"));
            auto mkcur = reinterpret_cast<P_MakeCurrent>(dlsym(h, "eglMakeCurrent"));
            auto qstr  = reinterpret_cast<P_QueryString>(dlsym(h, "eglQueryString"));
            auto err   = reinterpret_cast<P_GetError>(dlsym(h, "eglGetError"));
            auto dstd  = reinterpret_cast<P_DestroyDisplay>(dlsym(h, "eglDestroyDisplay"));
            if (!gpd || !init || !bapi || !cctx || !mkcur || !qstr || !dstd) {
              std::printf("[%s] symbol lookup FAILED\n", label); return 2;
            }
            return runChain(label, h, gpd, init, bapi, cctx, mkcur, qstr, err, dstd);
          }
          EOF
          g++ -o /tmp/glprobe /tmp/glprobe.cpp -ldl
          /tmp/glprobe baseline
          GALLIUM_DRIVER=llvmpipe /tmp/glprobe gallium-llvmpipe
          MESA_LOADER_DRIVER_OVERRIDE=llvmpipe /tmp/glprobe mesa-override-llvmpipe
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build build -j
      - name: Test (unit)
        run: ctest --test-dir build --output-on-failure

  linux-clang:
    name: Linux x64 (clang++)
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'ci:macos') &&
      !contains(github.event.pull_request.labels.*.name, 'ci:windows')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GLFW X11 headers (laige-render)
        # GLFW's X11 backend (GLFW_BUILD_WAYLAND=OFF in src/laige-render/
        # CMakeLists.txt) needs only the X11 *headers* at configure time
        # (GLFW 3.5 dlopens the X11/GL libraries at runtime); the
        # ubuntu-24.04 runner image ships none of them. The libegl/libgl
        # packages are the RUNTIME GL stack for the headless GL smoke
        # (Mesa surfaceless EGL + llvmpipe software GL; the engine and
        # GLAD load them by dlopen at runtime) (M2-GL-01).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev \
            libegl1 libgl1 libegl-mesa0 libglx-mesa0 libgl1-mesa-dri
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build -j
      - name: Test (unit)
        run: ctest --test-dir build --output-on-failure

  linux-asan:
    name: Linux x64 ASan+UBSan (clang++)
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'ci:macos') &&
      !contains(github.event.pull_request.labels.*.name, 'ci:windows')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Job-scoped token: the archive step below needs actions:write for
    # PRs from the base repository (fork PR tokens stay read-only,
    # whatever this declares — see header).
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Install GLFW X11 headers (laige-render)
        # GLFW's X11 backend (GLFW_BUILD_WAYLAND=OFF in src/laige-render/
        # CMakeLists.txt) needs only the X11 *headers* at configure time
        # (GLFW 3.5 dlopens the X11/GL libraries at runtime); the
        # ubuntu-24.04 runner image ships none of them. The libegl/libgl
        # packages are the RUNTIME GL stack for the headless GL smoke
        # (Mesa surfaceless EGL + llvmpipe software GL; the engine and
        # GLAD load them by dlopen at runtime) (M2-GL-01).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev \
            libegl1 libgl1 libegl-mesa0 libglx-mesa0 libgl1-mesa-dri
      - name: Configure (ASan+UBSan)
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DLAIGE_ASAN=ON
      - name: Build (ASan+UBSan)
        run: cmake --build build-asan -j
      - name: Test (unit, ASan+UBSan)
        # Every sanitizer report is fatal to the test process: ASan via
        # abort_on_error=1:halt_on_error=1 here, UBSan via
        # -fno-sanitize-recover=all (wired by CMake). log_path keeps one
        # report file per test process for the artifact upload below.
        env:
          ASAN_OPTIONS: "abort_on_error=1:halt_on_error=1:detect_leaks=1:log_path=${{ github.workspace }}/asan-reports/asan"
        run: |
          set -o pipefail
          ctest --test-dir build-asan --output-on-failure 2>&1 | tee asan-ctest-output.txt
      - name: Archive sanitizer reports
        # continue-on-error: fork PRs run with a read-only token, so the
        # upload 403s there (see header); the reports stay in the job log
        # and the tee'd output. The job-level actions:write covers PRs
        # from the base repository.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: linux-asan-reports
          path: |
            asan-ctest-output.txt
            asan-reports/
            build-asan/Testing/Temporary/LastTest.log

  linux-tsan:
    name: Linux x64 TSan (clang++)
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'ci:macos') &&
      !contains(github.event.pull_request.labels.*.name, 'ci:windows')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Job-scoped token: the archive step below needs actions:write (see
    # the linux-asan job comment).
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Install GLFW X11 headers (laige-render)
        # GLFW's X11 backend (GLFW_BUILD_WAYLAND=OFF in src/laige-render/
        # CMakeLists.txt) needs only the X11 *headers* at configure time
        # (GLFW 3.5 dlopens the X11/GL libraries at runtime); the
        # ubuntu-24.04 runner image ships none of them. The libegl/libgl
        # packages are the RUNTIME GL stack for the headless GL smoke
        # (Mesa surfaceless EGL + llvmpipe software GL; the engine and
        # GLAD load them by dlopen at runtime) (M2-GL-01).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev \
            libegl1 libgl1 libegl-mesa0 libglx-mesa0 libgl1-mesa-dri
      - name: Configure (TSan)
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DLAIGE_TSAN=ON
      - name: Build (TSan)
        run: cmake --build build-tsan -j
      - name: Test (unit, TSan)
        # TSAN_OPTIONS=halt_on_error=1 is applied per test by tests/
        # (M0-BUILD-01), so the first data race report kills the test
        # process and ctest fails. The race report is printed to stderr
        # and captured by the tee below.
        run: |
          set -o pipefail
          ctest --test-dir build-tsan --output-on-failure 2>&1 | tee tsan-ctest-output.txt
      - name: Archive sanitizer reports
        # continue-on-error and job-level permissions: same rationale as
        # the linux-asan job (fork PRs read-only, base-repo PRs can
        # upload).
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: linux-tsan-reports
          path: |
            tsan-ctest-output.txt
            build-tsan/Testing/Temporary/LastTest.log

  windows-msvc:
    name: Windows x64 (MSVC 2022)
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ci:windows') &&
      !contains(github.event.pull_request.labels.*.name, 'ci:macos')
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        # CMAKE_BUILD_TYPE is ignored by the multi-config VS generator; the
        # Debug configuration is pinned on the build/test steps below.
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --config Debug -j
      - name: Test (unit)
        # The trait_compile_* fixtures invoke cl.exe DIRECTLY from a
        # generated cmake -P script (execute_process), outside the VS
        # generator's toolchain setup, so — unlike every other test in
        # this job — they need the MSVC environment (INCLUDE/LIB/PATH)
        # to find the CRT/STL headers; the plain runner shell lacks it
        # and cl fails with C1083 on <cstdint> etc. This step imports
        # the VS development environment into the current PowerShell
        # process: vswhere locates the installation, VsDevCmd.bat (the
        # canonical vcvars, present in every VS 2017+ install under
        # Common7\Tools — called by relative name from that directory,
        # so no path quoting is involved) sets it, and its `set` dump
        # is imported variable by variable. ctest, cmake -P, and cl all
        # inherit it. Everything else in this step is unchanged.
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Push-Location (Join-Path $vs "Common7\Tools")
          $envDump = cmd /c "call VsDevCmd.bat -arch=amd64 -host_arch=amd64 >nul && set"
          Pop-Location
          foreach ($line in $envDump) {
            if ($line -match '^([A-Za-z_][A-Za-z0-9_]*)=(.*)$') {
              Set-Item -Path "env:$($matches[1])" -Value $matches[2]
            }
          }
          ctest --test-dir build -C Debug --output-on-failure

  macos-arm64:
    name: macOS arm64 (AppleClang)
    if: contains(github.event.pull_request.labels.*.name, 'ci:macos')
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j
      - name: Test (unit)
        run: ctest --test-dir build --output-on-failure

  macos-intel:
    name: macOS Intel (AppleClang)
    if: contains(github.event.pull_request.labels.*.name, 'ci:macos')
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j
      - name: Test (unit)
        run: ctest --test-dir build --output-on-failure

  include-lint:
    # M0-CI-03: runs on every PR (no ci:* condition). Platform-independent:
    # the lint is Python 3 stdlib only (no setup step needed) and checks
    # the repository layout, not a compiler-specific build. The CTest
    # suite runs it against the real tree in every P0 job as well
    # (tests/tools, test `include-lint-real-tree`), so a broken include
    # fails even a PR that selects another P0 OS.
    name: Include-graph lint + dependency count
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint include graph + report dependency count
        run: python3 tools/laige-include-lint

  determinism-lint:
    # M1-DET-01: runs on every PR (no ci:* condition). The sim-source
    # determinism scan (the second half of the G-R8 guarantee; the
    # first is the compile-time trait checked by the
    # trait_compile_* CTest fixtures): forbids raw float/double and
    # unordered containers in src/laige-sim/**, with per-line
    # LAIGE-DETERM-EXCEPTION markers as the documented false-positive
    # policy (docs/concepts/determinism.md). Platform-independent:
    # Python 3 stdlib only, no setup step. The CTest suite runs it
    # against fixture trees and the real tree in every P0 job as well
    # (tests/tools, tests `determinism-lint-*`).
    name: Determinism source scan (sim module)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan sim sources for raw FP / unordered containers
        run: python3 tools/laige-determinism-lint

  api-manifest:
    # M0-TOOL-01: runs on every PR (no ci:* condition). The checked-in
    # public API manifest (laige-api.json, PRD §9.4, NFR-13.1) must stay
    # in sync with the public headers: this job regenerates it from the
    # current headers with laige-api-scanner and fails on any drift, so
    # adding a public symbol without regenerating the manifest fails CI.
    # The CTest suite runs the same check against the real tree in every
    # P0 job as well (tests/api, test `api-real-tree`).
    name: Public API manifest drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GLFW X11 headers (laige-render)
        # GLFW's X11 backend (GLFW_BUILD_WAYLAND=OFF in src/laige-render/
        # CMakeLists.txt) needs only the X11 *headers* at configure time
        # (GLFW 3.5 dlopens the X11/GL libraries at runtime); the
        # ubuntu-24.04 runner image ships none of them. The libegl/libgl
        # packages are the RUNTIME GL stack for the headless GL smoke
        # (Mesa surfaceless EGL + llvmpipe software GL; the engine and
        # GLAD load them by dlopen at runtime) (M2-GL-01).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev \
            libegl1 libgl1 libegl-mesa0 libglx-mesa0 libgl1-mesa-dri
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build scanner
        run: cmake --build build --target laige-api-scanner -j
      - name: Check manifest drift
        run: ./build/bin/laige-api-scanner --root . --check laige-api.json

  detcheck:
    # M1-DET-04: runs on every PR (no ci:* condition). The determinism
    # checker (FR-11.5): the built-in synthetic scenario self-check,
    # then the M1-SAMPLE-01 hello scenario asserted against the
    # committed per-tick hash baselines (samples/hello/baselines/) on
    # BOTH SimMath backends (fixed_point_16_16, float_pinned_32 — ADR
    # 0002) with `hello --expect` (the laige-replay --expect contract:
    # 0 match, 1 first divergence, 2 baseline read/contract error).
    # The PR's P0 OS job's ctest repeats the same baseline assertion on
    # its own platform (tests/sample: hello_baseline_fpx /
    # hello_baseline_fp32); this tooling job guarantees the check runs
    # on every PR, including ones labelled for non-Linux P0 OSes. The
    # full two-configuration matrix (g++ vs clang++, Debug+ASan vs
    # Release) runs on merges in the detcheck job of ci.yml.
    name: Determinism check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GLFW X11 headers (laige-render)
        # GLFW's X11 backend (GLFW_BUILD_WAYLAND=OFF in src/laige-render/
        # CMakeLists.txt) needs only the X11 *headers* at configure time
        # (GLFW 3.5 dlopens the X11/GL libraries at runtime); the
        # ubuntu-24.04 runner image ships none of them. The libegl/libgl
        # packages are the RUNTIME GL stack for the headless GL smoke
        # (Mesa surfaceless EGL + llvmpipe software GL; the engine and
        # GLAD load them by dlopen at runtime) (M2-GL-01).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev \
            libegl1 libgl1 libegl-mesa0 libglx-mesa0 libgl1-mesa-dri
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j
      - name: Synthetic scenario self-check
        run: ./build/bin/laige-detcheck --scenario=synthetic
      - name: Real scenario vs baselines (M1-SAMPLE-01, both backends)
        # The hello template is always built in this job, so both steps
        # always execute. Each must exit 0 (a first-divergence report is
        # exit 1; a baseline read/contract failure is exit 2) and print
        # the 301-line per-tick hash stream.
        run: |
          ./samples/hello/bin/hello \
            --expect samples/hello/baselines/fixed_point_16_16/hash_stream.txt
          ./samples/hello/bin/hello-fp32 \
            --expect samples/hello/baselines/float_pinned_32/hash_stream.txt

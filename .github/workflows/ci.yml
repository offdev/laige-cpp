        run: cmake --build build-tsan -j
      - name: "Test (slow: zero_alloc, TSan)"
        run: |
          set -o pipefail
          ctest --test-dir build-tsan --output-on-failure \
            -R '^zero_alloc$' 2>&1 | tee tsan-ctest-output.txt
      - name: Archive sanitizer reports
        # Runs green or red: on a red run the reports live in this
        # artifact (one artifact per suite, per run).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-tsan-slow-zero-alloc
          path: |
            tsan-ctest-output.txt
            build-tsan/Testing/Temporary/LastTest.log

  linux-tsan-ecs-stress:
    name: "Linux x64 TSan (clang++) slow: ecs_stress"
    runs-on: ubuntu-24.04
    # 20: build (~2 min) + ecs_stress (54.70 s in the evidence run),
    # plus runner variance.
    timeout-minutes: 20
    # Job-scoped token: the archive step needs actions:write (see
    # linux-tsan).
    permissions:
      contents: read
      actions: write
    if: github.event.inputs.slow-ecs-stress == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install GLFW X11 headers (laige-render)
        # Same rationale as the main job (see linux-tsan).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev \
            libegl1 libgl1 libegl-mesa0 libglx-mesa0 libgl1-mesa-dri
      - name: Configure (TSan)
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DLAIGE_TSAN=ON
      - name: Build (TSan)
        run: cmake --build build-tsan -j
      - name: "Test (slow: ecs_stress, TSan)"
        run: |
          set -o pipefail
          ctest --test-dir build-tsan --output-on-failure \
            -R '^ecs_stress$' 2>&1 | tee tsan-ctest-output.txt
      - name: Archive sanitizer reports
        # Runs green or red: on a red run the reports live in this
        # artifact (one artifact per suite, per run).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-tsan-slow-ecs-stress
          path: |
            tsan-ctest-output.txt
            build-tsan/Testing/Temporary/LastTest.log

  windows-msvc:
    name: Windows x64 (MSVC 2022)
    runs-on: windows-2022
    # Unchanged by the 2026-10-13 slow-suite split: no ctest entry
    # exceeds 30 s on this lane (worst: laige-sim_tests 16.71 s in the
    # evidence run), so the full suite stays in the main job.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        # CMAKE_BUILD_TYPE is ignored by the multi-config VS generator; the
        # Debug configuration is pinned on the build/test steps below.
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --config Debug -j
      - name: Test (unit)
        # The trait_compile_* fixtures invoke cl.exe DIRECTLY from a
        # generated cmake -P script (execute_process), outside the VS
        # generator's toolchain setup, so — unlike every other test in
        # this job — they need the MSVC environment (INCLUDE/LIB/PATH)
        # to find the CRT/STL headers; the plain runner shell lacks it
        # and cl fails with C1083 on <cstdint> etc. This step imports
        # the VS development environment into the current PowerShell
        # process: vswhere locates the installation, VsDevCmd.bat (the
        # canonical vcvars, present in every VS 2017+ install under
        # Common7\Tools — called by relative name from that directory,
        # so no path quoting is involved) sets it, and its `set` dump
        # is imported variable by variable. ctest, cmake -P, and cl all
        # inherit it. Everything else in this step is unchanged.
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Push-Location (Join-Path $vs "Common7\Tools")
          $envDump = cmd /c "call VsDevCmd.bat -arch=amd64 -host_arch=amd64 >nul && set"
          Pop-Location
          foreach ($line in $envDump) {
            if ($line -match '^([A-Za-z_][A-Za-z0-9_]*)=(.*)$') {
              Set-Item -Path "env:$($matches[1])" -Value $matches[2]
            }
          }
          ctest --test-dir build -C Debug --output-on-failure

  macos-arm64:
    name: macOS arm64 (AppleClang)
    runs-on: macos-15
    # The shared macOS runners' tail latency exceeds the 10-min build
    # budget (the macOS exception, documented in this file's header).
    # 15 -> 20: this PR's run 38245828701 (2026-10-12) hit the 15-min
    # cap on all three attempts — each attempt finished its full
    # build + the 122/122 ctest suite at 15:00-15:10 and the cap
    # fired seconds before the job's final cleanup (the identical
    # macOS Intel job finished in 7:50 on the same run).
    # Unchanged by the 2026-10-13 slow-suite split: no ctest entry
    # exceeds 30 s on this lane (worst: laige-sim_tests 21.60 s in the
    # evidence run), so the full suite stays in the main job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j
      - name: Test (unit)
        run: ctest --test-dir build --output-on-failure

  macos-intel:
    name: macOS Intel (AppleClang)
    runs-on: macos-14
    # The shared macOS runners' tail latency exceeds the 10-min build
    # budget (the macOS exception, documented in this file's header).
    # Unchanged by the 2026-10-13 slow-suite split: no ctest entry
    # exceeds 30 s on this lane (worst: laige-sim_tests 27.11 s in the
    # evidence run), so the full suite stays in the main job.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure

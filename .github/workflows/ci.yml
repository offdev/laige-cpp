  include-lint:
    # M0-CI-03 (NFR-8.11, NFR-8.13): platform-independent repository
    # check — the include-graph lint over src/** plus the vendored-
    # dependency count (budget 10, PRD §11). See the header note.
    name: Include-graph lint + dependency count
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint include graph + report dependency count
        run: python3 tools/laige-include-lint

  determinism-lint:
    # M1-DET-01: platform-independent repository check — the sim-source
    # determinism scan (the second half of the G-R8 guarantee; the first
    # is the compile-time trait checked by the trait_compile_* CTest
    # fixtures). Forbids raw float/double and unordered containers in
    # src/laige-sim/**, with per-line LAIGE-DETERM-EXCEPTION markers as
    # the documented false-positive policy (docs/concepts/determinism.md).
    # Python 3 stdlib only, so one runner image suffices; it runs on
    # every PR too (ci-pull.yml, same job definition). The CTest suite
    # runs it against fixture trees and the real tree in every P0 job as
    # well (tests/tools, tests `determinism-lint-*`).
    name: Determinism source scan (sim module)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan sim sources for raw FP / unordered containers
        run: python3 tools/laige-determinism-lint

  api-manifest:
    # M0-TOOL-01 (PRD §9.4, NFR-13.1): the checked-in public API manifest
    # (laige-api.json) must stay in sync with the public headers. This
    # job regenerates the manifest from the current headers with
    # laige-api-scanner and fails on any drift, so adding a public symbol
    # without regenerating the manifest fails CI. The CTest suite runs
    # the same check against the real tree in every P0 job as well
    # (tests/api, test `api-real-tree`).
    name: Public API manifest drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GLFW X11 headers (laige-render)
        # GLFW's X11 backend (GLFW_BUILD_WAYLAND=OFF in src/laige-render/
        # CMakeLists.txt) needs only the X11 *headers* at configure time
        # (GLFW 3.5 dlopens the X11/GL libraries at runtime); the
        # ubuntu-24.04 runner image ships none of them. The libegl/libgl
        # packages are the RUNTIME GL stack for the headless GL smoke
        # (Mesa surfaceless EGL + llvmpipe software GL; the engine and
        # GLAD load them by dlopen at runtime) (M2-GL-01).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev \
            libegl1 libgl1 libegl-mesa0 libglx-mesa0 libgl1-mesa-dri
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build scanner
        run: cmake --build build --target laige-api-scanner -j
      - name: Check manifest drift
        run: ./build/bin/laige-api-scanner --root . --check laige-api.json

  detcheck:
    # M1-DET-04 (FR-11.5; AGENTS ARCH-010, TEST-004): bit-exactness CI.
    # The M1-SAMPLE-01 hello scenario is run headless across the
    # determinism matrix and asserted for per-tick hash identity:
    #
    #   vs the committed baselines (samples/hello/baselines/; reference
    #       build: canonical Debug g++) — the P0 OS jobs' ctest already
    #       runs this half on every platform (tests/sample:
    #       hello_baseline_fpx / hello_baseline_fp32); this job pins the
    #       reference build against its own baselines and adds the
    #       cross-build pairs no single P0 job can produce:
    #
    #   pair A:  g++ Debug   vs clang++ Debug     (the two Linux
    #                                                compilers)
    #   pair B:  Debug+ASan  vs g++ Release       (the two
    #                                                configurations)
    #
    #   ... x both SimMath backends (fixed_point_16_16 and
    #       float_pinned_32 — ADR 0002). A desynced pair is declared
    #       unsupported for float_pinned_32 (same-build/same-ISA
    #       scope); fixed_point_16_16 must always match. The result is
    #       recorded in docs/benchmarks/determinism-matrix.md (scope
    #       stated per ARCH-010).
    #
    # Like include-lint and api-manifest, the job runs on every PR and
    # merge unconditionally (it is a tooling check, not an additional P0
    # OS build — the PRD §14 cadence is unchanged).
    name: Determinism check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install GLFW X11 headers (laige-render)
        # GLFW's X11 backend (GLFW_BUILD_WAYLAND=OFF in src/laige-render/
        # CMakeLists.txt) needs only the X11 *headers* at configure time
        # (GLFW 3.5 dlopens the X11/GL libraries at runtime); the
        # ubuntu-24.04 runner image ships none of them. The libegl/libgl
        # packages are the RUNTIME GL stack for the headless GL smoke
        # (Mesa surfaceless EGL + llvmpipe software GL; the engine and
        # GLAD load them by dlopen at runtime) (M2-GL-01).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev \
            libegl1 libgl1 libegl-mesa0 libglx-mesa0 libgl1-mesa-dri
      # -- The four build configurations (targeted builds: only the
      #    scenario binaries and the checker — no full project build).
      #    The hello binaries land at the SOURCE-tree path
      #    samples/hello/bin/ (shared across build trees), so each
      #    tree's binaries are copied into detbin/ immediately after
      #    that tree is built.
      - name: Build reference (Debug g++)
        run: |
          cmake -S . -B build-det-ref \
                -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++
          cmake --build build-det-ref -j \
                --target hello hello-fp32 laige-detcheck
          mkdir -p detbin
          cp samples/hello/bin/hello detbin/hello-gcc-debug
          cp samples/hello/bin/hello-fp32 detbin/hello-fp32-gcc-debug
          cp build-det-ref/bin/laige-detcheck detbin/laige-detcheck
      - name: Build clang++ Debug
        run: |
          cmake -S . -B build-det-clang \
                -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-det-clang -j --target hello hello-fp32
          cp samples/hello/bin/hello detbin/hello-clang-debug
          cp samples/hello/bin/hello-fp32 detbin/hello-fp32-clang-debug
      - name: Build Debug + ASan (clang++)
        run: |
          cmake -S . -B build-det-asan \
                -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ \
                -DLAIGE_ASAN=ON
          cmake --build build-det-asan -j --target hello hello-fp32
          cp samples/hello/bin/hello detbin/hello-asan-debug
          cp samples/hello/bin/hello-fp32 detbin/hello-fp32-asan-debug
      - name: Build Release (g++)
        run: |
          cmake -S . -B build-det-release \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
          cmake --build build-det-release -j --target hello hello-fp32
          cp samples/hello/bin/hello detbin/hello-gcc-release
          cp samples/hello/bin/hello-fp32 detbin/hello-fp32-gcc-release
      # -- The reference build must reproduce its own committed baselines
      #    (a stale baseline is a loud job failure, never a silent
      #    re-baseline — CORE-008).
      - name: Reference baseline sanity
        run: |
          ./detbin/hello-gcc-debug \
            --expect samples/hello/baselines/fixed_point_16_16/hash_stream.txt
          ./detbin/hello-fp32-gcc-debug \
            --expect samples/hello/baselines/float_pinned_32/hash_stream.txt
      # -- The checker's built-in synthetic scenario self-check (two
      #    in-process runs; the M0-TOOL-02 step's Verify clause).
      - name: Synthetic scenario self-check
        run: ./detbin/laige-detcheck --scenario=synthetic
      # -- The two-configuration pairs (the roadmap matrix), both
      #    backends. Phase 1 spawns the two runs and streams their
      #    per-tick hash lines into one combined file (the children
      #    inherit the redirected stdout); phase 2 compares it offline
      #    (the Windows handle-delivery workaround; this job is
      #    ubuntu-only, so phase 1 is a plain bash redirection).
      - name: Pair A — g++ Debug vs clang++ Debug
        run: |
          ./detbin/laige-detcheck \
            --run-a=detbin/hello-gcc-debug --run-b=detbin/hello-clang-debug \
            > detbin/combined-a-fpx.txt
          ./detbin/laige-detcheck --compare-combined=detbin/combined-a-fpx.txt
          ./detbin/laige-detcheck \
            --run-a=detbin/hello-fp32-gcc-debug --run-b=detbin/hello-fp32-clang-debug \
            > detbin/combined-a-fp32.txt
          ./detbin/laige-detcheck --compare-combined=detbin/combined-a-fp32.txt
      - name: Pair B — Debug+ASan vs Release
        run: |
          ./detbin/laige-detcheck \
            --run-a=detbin/hello-asan-debug --run-b=detbin/hello-gcc-release \
            > detbin/combined-b-fpx.txt
          ./detbin/laige-detcheck --compare-combined=detbin/combined-b-fpx.txt
          ./detbin/laige-detcheck \
            --run-a=detbin/hello-fp32-asan-debug --run-b=detbin/hello-fp32-gcc-release \
            > detbin/combined-b-fp32.txt
          ./detbin/laige-detcheck --compare-combined=detbin/combined-b-fp32.txt
